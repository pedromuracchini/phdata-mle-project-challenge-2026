# Versions match the tools used by `make lint` and `make typecheck`; bump them together.
# Settings live in pyproject.toml, so the hooks and the Makefile check the same rules.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        # Same scope as `make typecheck`; the default args would override pyproject.toml.
        files: ^(src|\.claude/hooks)/
        args: []
