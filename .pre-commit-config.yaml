# Settings live in pyproject.toml, so the hooks and the Makefile check the same rules.
repos:
  # ruff rev must match the ruff==X pin in pyproject.toml (dev group); bump them together.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  # mypy runs from the project's .venv (locked mypy + the real runtime deps and stubs),
  # with the same command and paths as `make typecheck` (TYPECHECK_PATHS in the Makefile).
  # It checks the whole tree, not the staged files: types cross file boundaries.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy src .claude/hooks scripts tests
        language: system
        types: [python]
        pass_filenames: false
