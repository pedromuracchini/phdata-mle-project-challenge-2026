# Dependencies are managed with uv: edit with `uv add` / `uv add --dev`, never pip.
# Exact versions of every package live in uv.lock (committed).

[project]
name = "sound-realty-price-api"
version = "0.1.0"
description = "House-price prediction REST API for Sound Realty (Seattle area)."
requires-python = "==3.10.*"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    # model.pkl (Pipeline(RobustScaler -> KNN)) was pickled with these versions. Another
    # version can fail to unpickle or silently change predictions: never relax these pins
    # without re-running the characterization test (see docs/adr/001).
    "scikit-learn==1.7.2",
    "numpy==2.2.6",
    "pandas==2.3.3",
    # Transitive (via scikit-learn), pinned here because KNN distances run through it.
    "scipy==1.15.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "hypothesis",
    # Exact: must match the revs in .pre-commit-config.yaml; bump them together.
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pre-commit",
]

[tool.uv]
# An application, not a library: install the dependencies only, never the project itself.
package = false
# Local and Docker (Dockerfile COPY --from=ghcr.io/astral-sh/uv) use the same uv.
required-version = "==0.13.7"

[tool.ruff]
# The service runs on python:3.10-slim today. Raise this when the image moves to 3.11+.
target-version = "py310"
line-length = 100
extend-exclude = [
    # The data science team's research record: we read it, we don't edit it.
    "notebooks",
    # Model training scripts. The model is not retrained, so these stay as delivered.
    "create_model.py",
    "src/model/create_model.py",
    # LEGACY: original code that fails lint today. Remove each entry in the commit
    # that rewrites the file, so the rewrite is held to the full rules.
    "tests/conftest.py",           # Phase 1
    "tests/unit/test_api_unit.py", # Phase 1
    "src/main.py",                 # Phases 3-5
    "src/api/endpoints.py",        # Phases 3-5
    "src/utils/loader.py",         # Phases 3-5
]
# Apply the excludes even when a file is passed explicitly (pre-commit, the lint hook).
force-exclude = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "ASYNC", # blocking calls inside async def (CLAUDE.md: no CPU/disk work in async routes)
]

[tool.mypy]
python_version = "3.10"
strict = true
# Source modules import each other as top-level packages (`from api.endpoints import ...`).
mypy_path = "src"
explicit_package_bases = true
# Runtime deps (fastapi, pandas, ...) are not installed on the host until Phase 2 (uv).
# Remove this then, so third-party types are checked instead of treated as Any.
ignore_missing_imports = true

# Same exclusions as ruff above. An override (rather than `exclude`) also applies when
# pre-commit passes the file explicitly. Remove each module when its file is rewritten.
[[tool.mypy.overrides]]
module = [
    "model.create_model", # training script, model not retrained
    "api.endpoints",      # LEGACY: Phases 3-5
    "utils.loader",       # LEGACY: Phases 3-5
    "tests.conftest",                         # LEGACY: rewrite when the fixtures change
    "tests.unit.test_api_unit",               # LEGACY: rewrite when the fixtures change
    "tests.integration.test_api_integration", # LEGACY: rewrite when the fixtures change
]
ignore_errors = true

# pytest is not installed on the host until Phase 2, so its decorators are Any and every
# parametrized test would be reported as untyped. Remove with `ignore_missing_imports`.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
