# Tool configuration only. Phase 2 adds the [project] table and moves
# dependencies here from requirements*.txt (managed with uv).

[tool.ruff]
# The service runs on python:3.10-slim today. Raise this when the image moves to 3.11+.
target-version = "py310"
line-length = 100
extend-exclude = [
    # The data science team's research record: we read it, we don't edit it.
    "notebooks",
    # Model training scripts. The model is not retrained, so these stay as delivered.
    "create_model.py",
    "src/model/create_model.py",
    # LEGACY: original code that fails lint today. Remove each entry in the commit
    # that rewrites the file, so the rewrite is held to the full rules.
    "test/conftest.py",            # Phase 1
    "test/unit/test_api_unit.py",  # Phase 1
    "src/main.py",                 # Phases 3-5
    "src/api/endpoints.py",        # Phases 3-5
    "src/utils/loader.py",         # Phases 3-5
]
# Apply the excludes even when a file is passed explicitly (pre-commit, the lint hook).
force-exclude = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "ASYNC", # blocking calls inside async def (CLAUDE.md: no CPU/disk work in async routes)
]

[tool.mypy]
python_version = "3.10"
strict = true
# Source modules import each other as top-level packages (`from api.endpoints import ...`).
mypy_path = "src"
explicit_package_bases = true
# Runtime deps (fastapi, pandas, ...) are not installed on the host until Phase 2 (uv).
# Remove this then, so third-party types are checked instead of treated as Any.
ignore_missing_imports = true

# Same exclusions as ruff above. An override (rather than `exclude`) also applies when
# pre-commit passes the file explicitly. Remove each module when its file is rewritten.
[[tool.mypy.overrides]]
module = [
    "model.create_model", # training script, model not retrained
    "api.endpoints",      # LEGACY: Phases 3-5
    "utils.loader",       # LEGACY: Phases 3-5
]
ignore_errors = true
