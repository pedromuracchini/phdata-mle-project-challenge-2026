version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # No volumes: the test runs against the model and data baked into the image.
    # Health comes from the image's HEALTHCHECK (Python, GET /health; see Dockerfile).
    networks:
      - test-network

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://api:8000
    # Host user (passed by the Makefile) so files in test-results/ are not owned by root.
    user: "${HOST_USER:-1000:1000}"
    # Only the output directory is mounted; tests and src come from the image (built with --build).
    volumes:
      - ./test-results:/app/test-results
    command: pytest tests/integration -v
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
